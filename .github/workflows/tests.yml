name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    # Playwright 1.57 Chromium install requires a supported OS image (CI #74).
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: nexus_test
          POSTGRES_USER: nexus_user
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus_user -d nexus_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: testing
      # Fixed non-production CI key only (not a real secret). Kept in sync with .env below.
      APP_KEY: base64:2fl+KtvkdmxDJcq4+UZC0c41+6ehMy/PoKCjpTbOF0A=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: nexus_test
      DB_USERNAME: nexus_user
      DB_PASSWORD: secret
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, redis
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare environment
        run: |
          cp .env.example .env
          php -r '$p=".env"; $k=getenv("APP_KEY"); if ($k===false || $k==="") { fwrite(STDERR, "APP_KEY env missing\n"); exit(1);} $c=file_get_contents($p); $c=preg_replace("/^APP_KEY=.*/m", "APP_KEY=".$k, $c, -1, $count); if ($count!==1) { fwrite(STDERR, "Failed to set APP_KEY in .env\n"); exit(1);} file_put_contents($p, $c);'
          grep -q '^APP_KEY=base64:' .env

      - name: Run PostgreSQL migrations
        run: php artisan migrate --force --no-interaction

      - name: Generate Wayfinder TypeScript
        run: php artisan wayfinder:generate --with-form --no-interaction

      - name: Install NPM dependencies
        run: npm ci

      - name: Frontend check
        run: npm run check

      - name: Frontend types
        run: npm run types:check

      - name: Frontend production build
        run: npm run build

      - name: Pint
        run: vendor/bin/pint --test

      - name: Larastan
        run: vendor/bin/phpstan analyse --memory-limit=512M --no-interaction

      - name: Pest (PostgreSQL)
        run: php artisan test --compact

      # Disposable CI PostgreSQL only — never run against production/customer DBs.
      - name: Verify fresh database seeding
        run: php artisan migrate:fresh --seed --force --no-interaction

      - name: Verify database seeding idempotency
        run: php artisan db:seed --force --no-interaction

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      # Do not set PLAYWRIGHT_SKIP_WEBSERVER=0 — that string is truthy in JS and
      # disables Playwright's webServer (CI #75 ERR_CONNECTION_REFUSED).
      - name: Playwright smoke (login)
        run: npm run test:e2e:smoke
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8000
          APP_ENV: testing
          APP_KEY: base64:2fl+KtvkdmxDJcq4+UZC0c41+6ehMy/PoKCjpTbOF0A=
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: nexus_test
          DB_USERNAME: nexus_user
          DB_PASSWORD: secret
